<style>
/* Layout: one centred column, Moodle-like question card (pale blue) with code panel and inline dropdowns; sticky question navigator on top */
:root {
  --bg: #f4f6f8;
  --card: #e6f1f8;
  --card-line: #cfe0ec;
  --code: #f3f8fc;
  --surface: #ffffff;
  --fg: #1b2530;
  --muted: #5a6977;
  --line: #b9c9d6;
  --accent: #1d6aab;
  --accent-soft: #d6e7f5;
  --ok: #1f7a45;
  --ok-soft: #dcf1e4;
  --bad: #b3261e;
  --bad-soft: #f9dedb;
  --warn: #8a5a00;
  --warn-soft: #fbefd5;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-code: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12171c; --card: #1a2733; --card-line: #2a3c4c; --code: #15202a; --surface: #1d2a36;
  --fg: #e3eaf0; --muted: #9aabb9; --line: #3d5163; --accent: #6fb2ec; --accent-soft: #1f3a52;
  --ok: #6fd39a; --ok-soft: #173a27; --bad: #ff8f86; --bad-soft: #43201d; --warn: #f0c060; --warn-soft: #3b2f14;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12171c; --card: #1a2733; --card-line: #2a3c4c; --code: #15202a; --surface: #1d2a36;
  --fg: #e3eaf0; --muted: #9aabb9; --line: #3d5163; --accent: #6fb2ec; --accent-soft: #1f3a52;
  --ok: #6fd39a; --ok-soft: #173a27; --bad: #ff8f86; --bad-soft: #43201d; --warn: #f0c060; --warn-soft: #3b2f14;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
header.top h1 { margin: 0; font-size: 1.5rem; font-weight: 700; text-wrap: balance; }
header.top .sub { color: var(--muted); font-size: .9rem; }

.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.navbar .lbl { color: var(--muted); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; margin-right: 4px; }
.qbtn { width: 38px; height: 38px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface);
  color: var(--fg); font: 600 .95rem var(--font-body); cursor: pointer; position: relative; font-variant-numeric: tabular-nums; }
.qbtn.answered { background: var(--accent-soft); border-color: var(--accent); }
.qbtn.current { outline: 2px solid var(--accent); outline-offset: 2px; }
.qbtn.r-ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.qbtn.r-part { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.qbtn.r-bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
button:focus-visible, select:focus-visible, input:focus-visible + .mark { outline: 2px solid var(--accent); outline-offset: 2px; }

.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 6px; padding: 20px 22px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card .eyebrow { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .78rem;
  letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.card h2 { margin: 0; font-size: 1.15rem; text-wrap: balance; }
.card p, .card ul { margin: 0; max-width: 70ch; }
.card ul { padding-left: 1.2em; }
.stem { display: flex; flex-direction: column; gap: 10px; }
.instr { font-weight: 500; }

code, .code { font-family: var(--font-code); font-size: .86rem; }
.code { background: var(--code); border-radius: 4px; padding: 14px 16px; white-space: pre; overflow-x: auto;
  line-height: 1.75; color: var(--fg); }
.code select { font: inherit; vertical-align: middle; }

/* UML */
.uml { border: 1.5px solid var(--fg); background: var(--surface); border-collapse: collapse; min-width: 260px; max-width: 100%; }
.uml th { font-weight: 700; padding: 8px 14px; border-bottom: 1.5px solid var(--fg); text-align: center; }
.uml td { padding: 6px 14px; vertical-align: top; }
.uml td div { padding: 2px 0; }
.uml tr.attrs td { border-bottom: 1.5px solid var(--fg); }
.diagram { overflow-x: auto; }
.tree { width: 600px; max-width: 100%; display: flex; flex-direction: column; align-items: center; }
.tree svg { width: 100%; height: auto; display: block; }
.tree svg path, .tree svg polygon { stroke: var(--fg); fill: none; stroke-width: 1.5; }
.tree svg polygon { fill: var(--surface); }
.tree .kids { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; justify-items: center; }
.tree .kid { border: 1.5px solid var(--fg); background: var(--surface); padding: 6px 12px; font-weight: 700; font-size: .85rem; }
.tree .uml { min-width: 180px; }

/* selects */
select.blank { appearance: none; -webkit-appearance: none; background: var(--surface); color: var(--fg);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 34px 6px 10px; min-width: 9ch; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
select.blank.ok { border-color: var(--ok); background-color: var(--ok-soft); }
select.blank.bad { border-color: var(--bad); background-color: var(--bad-soft); }
.fix { font-family: var(--font-code); font-size: .8rem; color: var(--ok); margin-left: 6px; white-space: nowrap; }

/* options */
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: grid; grid-template-columns: 22px 1.6em 1fr; align-items: start; gap: 4px 6px; padding: 6px 8px;
  border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.opt:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .mark { width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--muted); background: var(--surface); display: grid; place-items: center; }
.opt.radio .mark { border-radius: 50%; }
.opt.check .mark { border-radius: 4px; }
.opt input:checked + .mark { border-color: var(--accent); }
.opt.radio input:checked + .mark::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
.opt.check input:checked + .mark { background: var(--accent); }
.opt.check input:checked + .mark::after { content: ""; width: 5px; height: 9px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.opt .let { color: var(--muted); }
.opt .txt { min-width: 0; }
.opt .txt .code { margin-top: 4px; padding: 10px 12px; line-height: 1.55; }
.opt.is-ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.is-missed { border-color: var(--ok); border-style: dashed; }
.review .opt { cursor: default; }
.tag { font-size: .75rem; font-weight: 600; margin-left: 6px; }
.is-ok .tag { color: var(--ok); } .is-bad .tag { color: var(--bad); } .is-missed .tag { color: var(--ok); }

/* footer controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.btn { font: 600 .95rem var(--font-body); padding: 10px 18px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.confirm { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 6px; padding: 14px 16px;
  display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.confirm p { margin: 0; }

/* results */
.result { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
.result .big { font-size: 2.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.result .big small { font-size: 1rem; color: var(--muted); font-weight: 500; }
.result .head { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: end; justify-content: space-between; }
.tblwrap { overflow-x: auto; }
table.sum { border-collapse: collapse; width: 100%; font-size: .9rem; }
table.sum th, table.sum td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
table.sum th { color: var(--muted); font-weight: 600; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
table.sum td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .78rem; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.part { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.keyline { font-family: var(--font-code); font-size: .82rem; }

@media (max-width: 520px) {
  .card { padding: 16px 14px; }
  .qbtn { width: 34px; height: 34px; }
}
@media (prefers-reduced-motion: no-preference) { .card { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); } } }
</style>

<div class="wrap">

<script>
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const uml = (name, attrs, methods) =>
  `<table class="uml"><tr><th>${name}</th></tr><tr class="attrs"><td>${attrs.map(a=>`<div>${esc(a)}</div>`).join("")}</td></tr><tr><td>${methods.map(m=>`<div>${esc(m)}</div>`).join("")}</td></tr></table>`;

const Q = [
{ topic: "Vererbung", type: "multi",
  title: "Aufgabe 1. Vererbung von Klassen",
  stem: `<p>In einem Computerspiel gibt es die Klasse <code>FIGUR</code>, von der drei Klassen erben:</p>
  <ul><li><code>KRIEGER</code></li><li><code>MAGIER</code></li><li><code>GILDE</code></li></ul>
  <p>Die Klasse <code>FIGUR</code> hat das Attribut <code>gesundheit</code> und die Methode <code>Bewegen()</code>.
  Die Klasse <code>KRIEGER</code> ergänzt das Attribut <code>ruestung</code>. Die Klasse <code>MAGIER</code> ergänzt das Attribut <code>mana</code> (magische Energie).
  Die Klasse <code>GILDE</code> ergänzt das Attribut <code>anzahlMitglieder</code>.</p>
  <div class="diagram"><div class="tree">${uml("FIGUR",["gesundheit: int"],["Bewegen()"])}
    <svg viewBox="0 0 600 62" aria-hidden="true"><polygon points="300,1 291,17 309,17"/><path d="M300 17V32M100 32H500M100 32V62M300 32V62M500 32V62"/></svg>
    <div class="kids"><div class="kid">KRIEGER</div><div class="kid">MAGIER</div><div class="kid">GILDE</div></div></div></div>`,
  instr: "Wähle alle richtigen Aussagen.",
  options: [
    ["a","GILDE muss eine Unterklasse von FIGUR bleiben, weil eine Gilde Figuren vereint."],
    ["b","Das Attribut gesundheit und die Methode Bewegen() müssen in KRIEGER und MAGIER jeweils separat angelegt werden."],
    ["c","KRIEGER und MAGIER können Unterklassen von FIGUR bleiben."],
    ["d","Das Attribut mana gehört zur Klasse MAGIER, das Attribut ruestung gehört zur Klasse KRIEGER."],
    ["e","Die Attribute mana, ruestung und anzahlMitglieder müssen in die Klasse FIGUR verschoben werden."],
    ["f","GILDE sollte keine Unterklasse von FIGUR sein, weil eine Gilde keine einzelne Figur ist."],
    ["g","Das Attribut gesundheit und die Methode Bewegen() können für KRIEGER und MAGIER gemeinsam in der Oberklasse FIGUR liegen."],
    ["h","KRIEGER muss die Oberklasse von MAGIER sein, weil beide an Kämpfen teilnehmen können."]],
  correct: ["c","d","f","g"] },

{ topic: "Objekte erzeugen", type: "fill",
  title: "Aufgabe 2. Objekt erzeugen und Methoden aufrufen",
  stem: `<p>Erzeuge ein Objekt der Klasse <code>LAMPE</code> mit der Anfangshelligkeit 4, schalte die Lampe ein und erhöhe die Helligkeit um 2.</p>
  <div class="diagram">${uml("LAMPE",["helligkeit: int","eingeschaltet: boolean"],["LAMPE(start: int)","Einschalten(): void","Erhoehen(schritt: int): void","HelligkeitAbfragen(): int"])}</div>`,
  instr: "Vervollständige das Programm. Wähle für jede Lücke die richtige Option.",
  code: "LAMPE lampe = {1} {2}({3});\n\nlampe.{4}();\n\nlampe.Erhoehen(2);",
  fields: { 1:{opts:["class","new","void"],correct:1}, 2:{opts:["LAMPE","lampe","Einschalten"],correct:0},
            3:{opts:["true","\"4\"","4"],correct:2}, 4:{opts:["Erhoehen","HelligkeitAbfragen","Einschalten"],correct:2} } },

{ topic: "Bedingungen", type: "single",
  title: "Aufgabe 3. Bedingte Anweisungen",
  stem: `<p>Die Methode <code>Eintrittspreis()</code> bestimmt den Preis einer Eintrittskarte für einen Freizeitpark abhängig vom Alter der Person.</p>
  <ul><li>Ist das Alter kleiner oder gleich 0, wird −1 zurückgegeben.</li><li>Bei einem Alter von 1 bis einschließlich 6 wird 0 zurückgegeben.</li>
  <li>Bei einem Alter von 7 bis einschließlich 17 wird 70 zurückgegeben.</li><li>Ab 18 Jahren wird 120 zurückgegeben.</li></ul>
  <p>Welche Implementierung erfüllt alle Bedingungen?</p>`,
  instr: "Wähle genau eine Antwort.", codeOpts: true,
  options: [
    ["a","int Eintrittspreis(int alter) {\n    if (alter <= 0) return -1;\n    else if (alter <= 6) return 0;\n    else if (alter < 17) return 70;\n    else return 120;\n}"],
    ["b","int Eintrittspreis(int alter) {\n    if (alter <= 17) return 70;\n    else if (alter <= 6) return 0;\n    else if (alter <= 0) return -1;\n    else return 120;\n}"],
    ["c","int Eintrittspreis(int alter) {\n    if (alter <= 0) return -1;\n    else if (alter <= 6) return 0;\n    else if (alter <= 17) return 70;\n    else return 120;\n}"],
    ["d","int Eintrittspreis(int alter) {\n    if (alter <= 6) return 0;\n    else if (alter <= 17) return 70;\n    else if (alter <= 0) return -1;\n    else return 120;\n}"]],
  correct: "c" },

{ topic: "Konstruktor und Attribute", type: "fill",
  title: "Aufgabe 4. Konstruktor und Ändern von Attributen",
  stem: `<p>Vervollständige die Klasse so, dass der Konstruktor die Anfangszahl der Bücher übernimmt und festlegt, dass die Bibliothek geöffnet ist, und <code>Aufnehmen()</code> die Anzahl der Bücher um den übergebenen Wert erhöht.</p>
  <div class="diagram">${uml("BIBLIOTHEK",["buecher: int","geoeffnet: boolean"],["BIBLIOTHEK(startbuecher: int)","Aufnehmen(neue: int): void"])}</div>`,
  instr: "Wähle für jede Lücke den richtigen Ausdruck.",
  code: "class BIBLIOTHEK {\n    {1};\n    boolean geoeffnet;\n\n    {2} {\n        {3};\n        geoeffnet = true;\n    }\n\n    void Aufnehmen(int neue) {\n        {4};\n    }\n}",
  fields: { 1:{opts:["boolean buecher","int buecher","String buecher"],correct:1},
            2:{opts:["void BIBLIOTHEK(int startbuecher)","BIBLIOTHEK()","BIBLIOTHEK(int startbuecher)"],correct:2},
            3:{opts:["buecher = startbuecher","startbuecher = buecher","buecher = 0"],correct:0},
            4:{opts:["buecher = neue","buecher = buecher + neue","neue = buecher + neue"],correct:1} } },

{ topic: "Datentypen", type: "multi",
  title: "Aufgabe 5. Attribute, Methoden und Datentypen",
  stem: `<p>Betrachte das Klassendiagramm der Klasse <code>BUCH</code>.</p>
  <div class="diagram">${uml("BUCH",["titel: String","seiten: int","preis: double","verfuegbar: boolean"],["Ausleihen(): void","PreisAbfragen(): double"])}</div>`,
  instr: "Wähle alle richtigen Aussagen.",
  options: [
    ["a","preis ist ein Attribut vom Typ double."],["b","Ausleihen() ist ein Attribut der Klasse BUCH."],
    ["c","titel ist ein Attribut vom Typ String."],["d","seiten ist ein Attribut vom Typ double."],
    ["e","verfuegbar ist ein Attribut vom Typ boolean."],["f","PreisAbfragen() ist eine Methode, die einen Wert vom Typ double zurückgibt."],
    ["g","void bedeutet, dass die Methode Ausleihen() true oder false zurückgibt."],["h","titel ist ein Parameter der Methode PreisAbfragen()."]],
  correct: ["a","c","e","f"] },

{ topic: "while-Schleife", type: "fill",
  title: "Aufgabe 6. while-Schleife",
  stem: `<p>In einem Computerspiel soll zur Prüfung eines Geheimcodes die Summe aller Ziffern einer positiven ganzen Zahl berechnet werden.
  Beispiel: Code <code>482</code>: 4 + 8 + 2 = 14.</p>
  <p>Die Methode <code>Ziffernsumme()</code> soll die Ziffernsumme der übergebenen Zahl zurückgeben.</p>`,
  instr: "Vervollständige die Schleifenbedingung und beide Aktualisierungen der Variablen.",
  code: "int Ziffernsumme(int zahl) {\n    int summe = 0;\n\n    while ({1}) {\n        summe = {2};\n        zahl = {3};\n    }\n\n    return summe;\n}",
  fields: { 1:{opts:["zahl < 0","zahl >= 0","zahl > 0"],correct:2},
            2:{opts:["summe + zahl / 10","summe + zahl % 10","zahl % 10"],correct:1},
            3:{opts:["zahl / 10","zahl % 10","zahl - 1"],correct:0} } },

{ topic: "Fehlersuche", type: "single",
  title: "Aufgabe 7. Logischen Fehler finden",
  stem: `<p>In einem Geschäft läuft eine Aktion: Jeder vierte Kunde erhält ein Geschenk. Die Methode <code>Geschenke()</code> soll zählen, wie viele Geschenke an die Kunden mit den Nummern von 1 bis einschließlich <code>anzahl</code> ausgegeben werden. Sie enthält genau einen logischen Fehler.</p>
  <div class="code">${esc("int Geschenke(int anzahl) {\n    int geschenke = 0;\n    for (int i = 1; i < anzahl; i = i + 1) {\n        if (i % 4 == 0) {\n            geschenke = geschenke + 1;\n        }\n    }\n    return geschenke;\n}")}</div>
  <p>Welche Korrektur und welcher Testfall passen zusammen?</p>`,
  instr: "Wähle genau eine Antwort.",
  options: [
    ["a","Die Bedingung muss i > anzahl lauten. Geschenke(12) muss 3 ergeben."],
    ["b","Der Restvergleich muss i % 4 == 1 lauten. Geschenke(12) ergibt dann 3, weil jeder vierte Kunde richtig gezählt wird."],
    ["c","geschenke muss jeweils um 2 erhöht werden. Geschenke(12) ergibt nach der Korrektur 3."],
    ["d","Die Bedingung muss i <= anzahl lauten. Geschenke(12) ergibt vorher 2 und nach der Korrektur 3."],
    ["e","Die Zählvariable i muss um 2 statt um 1 erhöht werden. Geschenke(12) ergibt nach der Korrektur 3."]],
  correct: "d" },

{ topic: "for-Schleife", type: "single",
  title: "Aufgabe 8. for-Schleife und Aufsummieren",
  stem: `<p>Ein Spieler erhält Bonusmünzen für jedes vierte Level; die Anzahl der Münzen entspricht der Levelnummer (Level 4: 4 Münzen, Level 8: 8 Münzen, Level 12: 12 Münzen).</p>
  <p>Die Methode <code>Bonussumme()</code> soll die Gesamtzahl der Münzen für alle durch 4 teilbaren Level von 4 bis einschließlich 20 berechnen. Welche Implementierung ist richtig?</p>`,
  instr: "Wähle genau eine Antwort.", codeOpts: true,
  options: [
    ["a","int Bonussumme() {\n    int summe = 0;\n    for (int i = 4; i < 20; i = i + 4) {\n        summe = summe + i;\n    }\n    return summe;\n}"],
    ["b","int Bonussumme() {\n    int summe = 0;\n    for (int i = 4; i <= 20; i = i + 1) {\n        summe = summe + i;\n    }\n    return summe;\n}"],
    ["c","int Bonussumme() {\n    int summe = 0;\n    for (int i = 4; i <= 20; i = i + 4) {\n        summe = summe + i;\n    }\n    return summe;\n}"],
    ["d","int Bonussumme() {\n    int summe = 0;\n    for (int i = 0; i <= 20; i = i + 5) {\n        summe = summe + i;\n    }\n    return summe;\n}"]],
  correct: "c" }
];

const LS = "java-test-de-v1";
let S = { cur: 0, answers: {}, done: false };
try { const s = JSON.parse(localStorage.getItem(LS)); if (s && s.answers) S = s; } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };

function isAnswered(i) {
  const q = Q[i], a = S.answers[i];
  if (!a) return false;
  if (q.type === "multi") return a.length > 0;
  if (q.type === "single") return !!a;
  return Object.keys(q.fields).some(k => a[k] !== undefined && a[k] !== "");
}
function grade(i) {
  const q = Q[i], a = S.answers[i];
  if (q.type === "single") return a === q.correct ? 1 : 0;
  if (q.type === "multi") {
    const sel = a || [], hit = sel.filter(x => q.correct.includes(x)).length, miss = sel.length - hit;
    return Math.max(0, (hit - miss) / q.correct.length);
  }
  const keys = Object.keys(q.fields);
  return keys.filter(k => a && String(a[k]) === String(q.fields[k].correct)).length / keys.length;
}
const L = "abcdefgh";
function keyText(q) {
  if (q.type === "single") return q.correct;
  if (q.type === "multi") return q.correct.join(", ");
  return Object.keys(q.fields).map(k => `${k}-${L[q.fields[k].correct]}`).join(", ");
}

function renderNav() {
  const nav = document.getElementById("nav");
  nav.innerHTML = `<span class="lbl">Aufgaben</span>` + Q.map((q, i) => {
    let cls = "qbtn";
    if (S.done) { const g = grade(i); cls += g === 1 ? " r-ok" : g > 0 ? " r-part" : " r-bad"; }
    else if (isAnswered(i)) cls += " answered";
    if (!S.done && i === S.cur) cls += " current";
    return `<button class="${cls}" data-go="${i}" aria-label="Aufgabe ${i+1}">${i+1}</button>`;
  }).join("");
}

function questionHTML(i, review) {
  const q = Q[i], a = S.answers[i];
  let body = "";
  if (q.type === "fill") {
    let code = esc(q.code);
    code = code.replace(/\{(\d)\}/g, (_, k) => {
      const f = q.fields[k], v = a && a[k] !== undefined ? String(a[k]) : "";
      let cls = "blank", extra = "";
      if (review) { const ok = v === String(f.correct); cls += ok ? " ok" : " bad";
        if (!ok) extra = `<span class="fix">→ ${esc(f.opts[f.correct])}</span>`; }
      return `<select class="${cls}" id="q${i}f${k}" data-q="${i}" data-f="${k}" aria-label="Lücke ${k}" ${review ? "disabled" : ""}>
        <option value=""></option>${f.opts.map((o, j) => `<option value="${j}" ${v === String(j) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${extra}`;
    });
    body = `<div class="code">${code}</div>`;
  } else {
    const multi = q.type === "multi", sel = multi ? (a || []) : a;
    body = `<div class="opts" role="${multi ? "group" : "radiogroup"}">` + q.options.map(([k, t]) => {
      const checked = multi ? sel.includes(k) : sel === k;
      const isC = multi ? q.correct.includes(k) : q.correct === k;
      let cls = "opt " + (multi ? "check" : "radio"), tag = "";
      if (review) {
        if (checked && isC) { cls += " is-ok"; tag = "richtig"; }
        else if (checked && !isC) { cls += " is-bad"; tag = "falsch"; }
        else if (!checked && isC) { cls += " is-missed"; tag = "richtige Antwort"; }
      }
      const txt = q.codeOpts ? `<div class="code">${esc(t)}</div>` : esc(t);
      return `<label class="${cls}"><input type="${multi ? "checkbox" : "radio"}" name="q${i}" id="q${i}o${k}" value="${k}" data-q="${i}" ${checked ? "checked" : ""} ${review ? "disabled" : ""}><span class="mark"></span><span class="let">${k}.</span><span class="txt">${txt}${tag ? `<span class="tag">${tag}</span>` : ""}</span></label>`;
    }).join("") + `</div>`;
  }
  let status = "";
  if (review) { const g = grade(i);
    status = `<span class="pill ${g === 1 ? "ok" : g > 0 ? "part" : "bad"}">${g === 1 ? "Richtig" : g > 0 ? "Teilweise" : "Falsch"} · ${fmt(g)} von 1</span>`; }
  return `<section class="card" id="card${i}">
    <div class="eyebrow"><span>Aufgabe ${i+1} von ${Q.length} · ${q.topic}</span>${status}</div>
    <h2>${q.title}</h2><div class="stem">${q.stem}</div>
    <p class="instr">${q.instr}</p>${body}</section>`;
}
const fmt = n => (Math.round(n * 100) / 100).toString().replace(".", ",");

function render(confirming) {
  renderNav();
  const main = document.getElementById("main");
  if (S.done) return renderResult(main);
  const i = S.cur, last = i === Q.length - 1;
  const unanswered = Q.map((_, j) => j).filter(j => !isAnswered(j)).map(j => j + 1);
  main.innerHTML = questionHTML(i, false) +
    (confirming ? `<div class="confirm"><p>${unanswered.length ? `Ohne Antwort: Aufgabe ${unanswered.join(", ")}. Test trotzdem beenden?` : "Alle Aufgaben sind beantwortet. Test beenden und Ergebnis anzeigen?"}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="cancel">Zurück zum Test</button><button class="btn primary" data-act="finish">Beenden</button></div></div>` : "") +
    `<div class="controls"><button class="btn" data-act="prev" ${i === 0 ? "disabled" : ""}>← Zurück</button>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${last ? "" : `<button class="btn" data-act="next">Weiter →</button>`}
      <button class="btn primary" data-act="ask">Test beenden</button></div></div>`;
}

function renderResult(main) {
  const scores = Q.map((_, i) => grade(i)), total = scores.reduce((s, x) => s + x, 0);
  const pct = Math.round(total / Q.length * 100);
  main.innerHTML = `<section class="result">
    <div class="head"><div><div class="sub" style="color:var(--muted)">Ergebnis</div>
      <div class="big">${fmt(total)} <small>von ${Q.length} Punkten · ${pct}%</small></div></div>
      <button class="btn primary" data-act="restart">Neu starten</button></div>
    <div class="tblwrap"><table class="sum"><thead><tr><th>Nr.</th><th>Thema</th><th>Richtige Antwort</th><th>Punkte</th></tr></thead><tbody>
    ${Q.map((q, i) => { const g = scores[i];
      return `<tr><td class="num"><a href="#card${i}" style="color:var(--accent)">${i+1}</a></td><td>${q.topic}</td><td class="keyline">${keyText(q)}</td>
      <td class="num"><span class="pill ${g === 1 ? "ok" : g > 0 ? "part" : "bad"}">${fmt(g)}</span></td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="sub" style="color:var(--muted);margin:0">Aufgaben mit mehreren Antworten und Lücken werden anteilig bewertet. Unten folgt die Auswertung jeder Aufgabe.</p>
  </section>` + Q.map((_, i) => questionHTML(i, true)).join("");
  main.classList.add("review");
}

document.addEventListener("change", e => {
  const t = e.target, i = +t.dataset.q;
  if (isNaN(i) || S.done) return;
  const q = Q[i];
  if (q.type === "fill") { S.answers[i] = S.answers[i] || {}; S.answers[i][t.dataset.f] = t.value; }
  else if (q.type === "single") S.answers[i] = t.value;
  else { const set = new Set(S.answers[i] || []); t.checked ? set.add(t.value) : set.delete(t.value); S.answers[i] = [...set].sort(); }
  save(); renderNav();
});
document.addEventListener("click", e => {
  const b = e.target.closest("[data-go],[data-act]"); if (!b) return;
  if (b.dataset.go !== undefined) {
    if (S.done) { document.getElementById("card" + b.dataset.go)?.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    S.cur = +b.dataset.go; save(); render(); window.scrollTo(0, 0); return;
  }
  const act = b.dataset.act;
  if (act === "prev" && S.cur > 0) { S.cur--; save(); render(); window.scrollTo(0, 0); }
  if (act === "next" && S.cur < Q.length - 1) { S.cur++; save(); render(); window.scrollTo(0, 0); }
  if (act === "ask") { render(true); document.querySelector(".confirm")?.scrollIntoView({ block: "center" }); }
  if (act === "cancel") render();
  if (act === "finish") { S.done = true; save(); render(); window.scrollTo(0, 0); }
  if (act === "restart") { S = { cur: 0, answers: {}, done: false }; save(); document.getElementById("main").classList.remove("review"); render(); window.scrollTo(0, 0); }
});
render();
</script>

</body></html>
